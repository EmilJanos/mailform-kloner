<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mailform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&family=Ubuntu:wght@400;700&family=Montserrat:wght@400;700&family=Oswald:wght@400;700&family=Playfair+Display:wght@400;700&family=Merriweather:wght@400;700&family=Lora:wght@400;700&family=Caveat:wght@400;700&display=swap">
<link rel="stylesheet" href="/mf-text.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="/assets/fa785b25128d13618352.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="config.js"></script>
<style>
.mf-row { display: flex; gap: 3%; align-items: flex-start; }
.mf-col { flex: 1 1 0; min-width: 0; }
@media (max-width: 660px) { .mf-row { display: block; } }
</style>
</head>
<body class="no-touch">
<div class="template-content"><div class="container container--main">
  <header class="template-header"><div class="container"></div></header>
  <section class="page page--default"><div class="zone-content"><div class="container">
    <section class="bk-zone column" id="page-zones__main"></section>
  </div></div></section>
</div></div>
<footer class="template-footer"><div class="container"></div></footer>
<script type="module">
import { db, clean, esc } from "./common.js";
const zone = document.getElementById("page-zones__main");
// Sektioner med samme "row" står side om side (2–3 kolonner). Bredde: w = 1–3.
function mfLayout(secs, htmls) {
  const out = [];
  for (let i = 0; i < secs.length; ) {
    const r = secs[i].row;
    let j = i + 1;
    if (r) while (j < secs.length && secs[j].row === r && j - i < 3) j++;
    if (r && j - i >= 2) {
      let cols = "";
      for (let k = i; k < j; k++) cols += `<div class="mf-col" style="flex-grow:${Math.min(3, Math.max(1, Math.round(+secs[k].w || 1)))}">${htmls[k]}</div>`;
      out.push(`<div class="mf-row">${cols}</div>`);
    } else out.push(htmls[i]);
    i = j;
  }
  return out.join("");
}
let slug = (new URLSearchParams(location.search).get("p") || location.pathname.replace(/^\/|\/$/g, "")).toLowerCase();

if(slug==='missinglink')slug='missing';
const { data: page } = await db.from("pages").select("id,slug,title,legend,sections,published").eq("slug", slug).maybeSingle();
if (!page) { zone.innerHTML = "<p style='text-align:center;padding:60px 0'>Siden findes ikke.</p>"; }
else {
  document.title = page.title || page.slug;
  const banner = page.published ? "" : "<div class='ole-placeholder'>Kladde: kun du kan se den her</div>";
  zone.innerHTML = banner + mfLayout(page.sections, page.sections.map((s) =>
    s.kind === "placeholder"
      ? (s.html && s.html.trim()
          ? `<div class="widget widget--zone-widget"><div class="bk-content-text content widget__content"><span class="content-block">${clean(s.html)}</span></div></div>`
          : `<div class="ole-placeholder">Tekst indsættes af ejeren</div>`)
      : clean(s.html)
  ));

  zone.querySelectorAll('[data-mf-form]').forEach(slot=>{slot.innerHTML='<form class="form contactform__form"><fieldset><legend></legend><label>Din email<input type="email" required></label><label>Besked<textarea required></textarea></label><button type="submit">Send</button></fieldset></form>';});
  // Keep the original form markup and connect it to our own endpoint.
  zone.querySelectorAll('form').forEach(form => {
    const legend=form.querySelector('legend'); if(legend) legend.textContent=page.legend;
    const trap=document.createElement('input'); trap.name='website';trap.tabIndex=-1;trap.autocomplete='off';trap.style.cssText='position:absolute;left:-9999px';trap.setAttribute('aria-hidden','true');form.append(trap);
    const status=document.createElement('div');status.setAttribute('role','status');form.append(status);
    form.addEventListener('submit',async event=>{
      event.preventDefault();
      const button=form.querySelector('[type=submit]');if(button)button.disabled=true;
      status.textContent='Sender…';
      try{
        const {data,error}=await db.functions.invoke('send-form',{body:{slug:page.slug,email:form.querySelector('input[type=email]')?.value,message:form.querySelector('textarea')?.value,website:trap.value}});
        if(error||!data?.ok)throw Error('send');
        status.textContent=data.mailed===true?'Tak! Din besked er sendt.':'Tak! Din besked er gemt. Mailafsendelse er ikke bekræftet.';form.reset();
      }catch{status.textContent='Beskeden kunne ikke gemmes. Tjek mailadressen og prøv igen.';}
      finally{if(button)button.disabled=false;}
    });
  });
  zone.querySelectorAll('.gallery__image-link').forEach(a=>{
    const image=a.querySelector('img'); if(image){a.style.backgroundImage='url("'+image.src+'")';a.href=image.src;a.target='_blank';a.rel='noopener';}
  });
}
</script>
</body></html>
