<style>
/* Editorens egne knapper. Alt har mf- foran, så sidens stil ikke rammer det. */
.mf-ui, .mf-ui * { box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 0; text-transform: none; line-height: 1.3; }
.mf-top { position: sticky; top: 0; z-index: 1000; background: #15161c; border-bottom: 1px solid #3a3c48; padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: #eceef6; font-size: 14px; }
.mf-top .mf-sep { width: 1px; height: 24px; background: #3a3c48; margin: 0 4px; }
.mf-ui button, .mf-ui select, .mf-ui input[type=text] { all: unset; box-sizing: border-box; cursor: pointer; height: 32px; min-width: 32px; padding: 0 9px; border: 1px solid #3a3c48; border-radius: 6px; background: #262730; color: #eceef6; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
.mf-ui input[type=text] { cursor: text; min-width: 160px; }
.mf-ui button:hover, .mf-ui select:hover { background: #31333e; }
.mf-ui button:focus-visible, .mf-ui select:focus-visible, .mf-ui input:focus-visible { outline: 2px solid #8d9bff; outline-offset: 1px; }
.mf-ui button.mf-primary { background: #5061de; border-color: #5061de; color: #fff; font-weight: 600; }
.mf-ui button.mf-primary:hover { background: #3d4ec9; }
.mf-ui button.mf-danger:hover { background: #7a2630; border-color: #7a2630; }
.mf-cl { display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 2px 0 8px; border: 1px solid #3a3c48; border-radius: 6px; background: #262730; color: #eceef6; font: 600 14px/1 system-ui, sans-serif; cursor: pointer; margin: 0; }
.mf-cl input[type=color] { width: 24px !important; height: 24px !important; border: 0 !important; padding: 0 !important; background: transparent !important; }
.mf-ui input[type=color] { width: 32px; height: 32px; padding: 2px; border: 1px solid #3a3c48; border-radius: 6px; background: #262730; cursor: pointer; }
.mf-status { margin-left: auto; font-size: 13px; color: #9a9db0; }
.mf-status.ok { color: #6fd38c; } .mf-status.err { color: #ff7b7b; }
.mf-meta { display: none; width: 100%; gap: 6px; flex-wrap: wrap; align-items: center; padding-top: 6px; }
.mf-meta.open { display: flex; }
.mf-meta label { font-size: 13px; color: #9a9db0; display: inline-flex; align-items: center; gap: 6px; margin: 0; padding: 0; font-family: inherit; }

/* Sektioner */
.mf-sec { position: relative; outline: 1px dashed transparent; outline-offset: 4px; margin-bottom: 8px; }
.mf-sec:hover, .mf-sec:focus-within { outline-color: rgba(141, 155, 255, 0.55); }
.mf-bar { position: absolute; top: -14px; right: 0; z-index: 20; display: none; gap: 4px; }
.mf-sec:hover > .mf-bar, .mf-sec:focus-within > .mf-bar { display: flex; }
.mf-bar button { height: 26px; min-width: 26px; padding: 0 7px; font-size: 12px; }
.mf-body { min-height: 40px; outline: none; cursor: text; }
.mf-body:empty::before { content: attr(data-hint); display: block; padding: 14px; border: 1px dashed rgba(137,140,162,0.6); color: rgb(137,140,162); text-align: center; font-size: 13px; }
.mf-ph { border: 1px dashed rgba(137,140,162,0.6); padding: 10px; }
.mf-lockbox { position: relative; }
.mf-lockbox::after { content: attr(data-mf-label); position: absolute; top: 4px; left: 4px; z-index: 5; background: rgba(21,22,28,0.85); color: #eceef6; font: 12px/1.4 system-ui, sans-serif; padding: 2px 6px; border-radius: 4px; pointer-events: none; }
/* Galleriet vises som almindelige billeder mens man redigerer */
.mf-edit .gallery__image { display: block; width: 100%; height: 100%; object-fit: cover; }
.mf-add { display: flex; justify-content: center; padding: 10px 0 40px; }
/* Kolonner: sektioner der står side om side. Stables på smalle skærme. */
.mf-row { display: flex; gap: 3%; align-items: flex-start; margin-bottom: 8px; }
.mf-row > .mf-sec { flex: 1 1 0; min-width: 0; }
@media (max-width: 660px) { .mf-row { flex-direction: column; } .mf-row > .mf-sec { width: 100%; } }
.mf-bar { flex-wrap: wrap; justify-content: flex-end; max-width: 100%; }
.mf-bar .mf-drag { cursor: grab; touch-action: none; }
.mf-bar .mf-w { display: none; }
.mf-row > .mf-sec > .mf-bar .mf-w { display: inline-flex; }
.mf-edit .mf-body img, .mf-edit .mf-video { cursor: grab; -webkit-user-drag: none; }
.mf-edit .mf-body img { max-width: 100%; }
.mf-edit iframe, .mf-edit video { pointer-events: none; }
.mf-egrip { position: fixed; z-index: 1500; width: 22px; height: 24px; display: none; align-items: center; justify-content: center; border-radius: 4px; background: #5061de; color: #fff; cursor: grab; touch-action: none; font: 13px/1 system-ui, sans-serif; user-select: none; box-shadow: 0 1px 4px rgba(0,0,0,0.4); }
.mf-egrip:hover { background: #3d4ec9; }
.mf-el-dragging { opacity: 0.35; outline: 2px dashed #8d9bff; }
.mf-grip { position: absolute; left: -34px; top: 0; bottom: 0; width: 10px; display: none; align-items: center; justify-content: center; border-radius: 5px; background: rgba(141,155,255,0.18); color: #b9c1ff; cursor: grab; touch-action: none; font: 15px/1 system-ui, sans-serif; z-index: 15; user-select: none; }
.mf-grip:hover { background: rgba(141,155,255,0.4); }
.mf-sec:hover > .mf-grip, .mf-sec:focus-within > .mf-grip { display: flex; }
@media (hover: none) { .mf-grip { display: none !important; } }
.mf-sec.mf-dragging { opacity: 0.35; }
body.mf-is-dragging, body.mf-is-dragging * { cursor: grabbing !important; user-select: none !important; }
.mf-ind { position: fixed; z-index: 2000; background: #8d9bff; border-radius: 3px; pointer-events: none; display: none; box-shadow: 0 0 0 2px rgba(141,155,255,0.3); }
.mf-ind.bad { background: #ff7b7b; }
.mf-ghost { position: fixed; z-index: 2001; pointer-events: none; display: none; background: #15161c; color: #eceef6; border: 1px solid #8d9bff; border-radius: 6px; padding: 4px 10px; font: 13px/1.4 system-ui, sans-serif; white-space: nowrap; }
</style>
</head>
<body class="no-touch mf-edit">
<div class="mf-ui mf-top" id="mf-top">

  <button data-cmd="underline" title="Understreg (Ctrl+U)"><u>U</u></button>

  <select id="mf-block" title="Afsnitstype">

<div class="template-content"><div class="container container--main">
  <header class="template-header"><div class="container"></div></header>
  <section class="page page--default"><div class="zone-content"><div class="container">
    <section class="bk-zone column" id="page-zones__main"></section>
    <div class="mf-ui mf-add"><button id="mf-add-end">+ Ny tekstblok nederst</button></div>
  </div></div></section>
</div></div>
<footer class="template-footer"><div class="container"></div></footer>

<script type="module">
import { db, clean } from "./common.js";

const zone = document.getElementById("page-zones__main");
const statusEl = document.getElementById("mf-status");
const say = (t, c = "") => { statusEl.textContent = t; statusEl.className = "mf-status " + c; };
const slug = (new URLSearchParams(location.search).get("p") || "").toLowerCase();
let page = null;
let dirty = false;
let currentUserId = null;
let canEdit = false;
let saving = false;
let editVersion = 0;
const markDirty = () => { editVersion++; if (!dirty) { dirty = true; say("Ikke gemt"); } if (!restoring) scheduleSnap(); };

// --- Fortryd / gentag: egen historik over hele siden (tekst, flytninger, upload, sletning) ---
let history = [], histPos = -1, snapTimer = null, restoring = false;
const HIST_MAX = 100;
function snapNow() {
  clearTimeout(snapTimer); snapTimer = null;
  if (!page) return;
  const state = JSON.stringify(collect());
  if (history[histPos] === state) return;
  history = history.slice(0, histPos + 1);
  history.push(state);
  if (history.length > HIST_MAX) history.shift();
  histPos = history.length - 1;
  updateHistButtons();
}
function scheduleSnap() { clearTimeout(snapTimer); snapTimer = setTimeout(snapNow, 600); updateHistButtons(true); }
function updateHistButtons(pending) {
  const u = document.querySelector('[data-cmd="undo"]'), r = document.querySelector('[data-cmd="redo"]');
  if (!u || !canEdit) return;
  u.disabled = !(pending || histPos > 0);
  r.disabled = !!pending || histPos >= history.length - 1;
}
function histStep(dir) {
  if (snapTimer) snapNow();
  const next = histPos + dir;
  if (next < 0 || next >= history.length) return say(dir < 0 ? "Intet at fortryde" : "Intet at gentage");
  histPos = next;
  restoring = true;
  buildZone(JSON.parse(history[histPos]));
  zone.querySelectorAll("legend").forEach((l) => (l.textContent = document.getElementById("mf-legend").value));
  markDirty();
  restoring = false;
  savedRange = null;
  if (typeof placeEgrip === "function") placeEgrip(null);
  updateHistButtons();
  say(dir < 0 ? "Fortrudt – husk at gemme" : "Gentaget – husk at gemme");
}

// Ting der ikke må redigeres som tekst (formularer, galleri, video) låses og får en lille mærkat.
const LOCKS = [
  ["form", "Formular – virker på den rigtige side"],
  [".gallery", "Galleri – rettes i HTML-visning"],
  ["iframe", null],
  ["video", null],
  [".mf-video", null],
];
function lock(root) {
  for (const [sel, label] of LOCKS) {
    root.querySelectorAll(sel).forEach((el) => {
      el.setAttribute("contenteditable", "false");
      el.setAttribute("data-mf-lock", "");
      if (label) { el.classList.add("mf-lockbox"); el.setAttribute("data-mf-label", label); }
    });
  }
}
function unlock(root) {
  root.querySelectorAll("[data-mf-lock]").forEach((el) => {
    el.removeAttribute("contenteditable");
    el.removeAttribute("data-mf-lock");
    el.removeAttribute("data-mf-label");
    el.classList.remove("mf-lockbox");
    if (!el.getAttribute("class")) el.removeAttribute("class");
  });
}

const originals = new Map(); // bevarer felter vi ikke selv kender, når vi gemmer
function sectionEl(s) {
  const wrap = document.createElement("div");
  wrap.className = "mf-sec";
  wrap.dataset.kind = s.kind;
  wrap.dataset.id = s.id;
  if (s.w) wrap.dataset.w = String(s.w);
  originals.set(s.id, s);
  wrap.innerHTML = `<div class="mf-grip" contenteditable="false" title="Træk hele boksen – slip til venstre/højre for kolonner"></div><div class="mf-ui mf-bar" contenteditable="false">
      <button data-act="drag" class="mf-drag" title="Flyt hele boksen – slip til venstre/højre for kolonner">⠿ Flyt boks</button>
      <button data-act="up" title="Flyt op">↑</button>
      <button data-act="down" title="Flyt ned">↓</button>
      <button data-act="add" title="Ny tekstblok under denne">+ Tekst</button>
      <button data-act="w" class="mf-w" title="Skift bredde på kolonnen">Bredde</button>
      <button data-act="del" class="mf-danger" title="Slet sektionen">Slet</button>
    </div>`;
  const body = document.createElement("div");
  body.className = "mf-body" + (s.kind === "placeholder" ? " mf-ph" : "");
  body.contentEditable = "true";
  body.dataset.hint = s.kind === "placeholder" ? "Tekst indsættes af ejeren – klik og skriv" : "Klik og skriv";
  body.innerHTML = clean(s.html || "");
  lock(body);
  wrap.append(body);
  return wrap;
}

// Ny sektion øverst på siden (billede/video uden at man skal vælge sted først). Træk den derhen, hvor den skal stå.
function addTopSection(inner) {
  const sec = sectionEl({ id: "s" + Date.now(), kind: "html",
    html: `<div class="widget widget--zone-widget"><div class="bk-content-text content widget__content"><span class="content-block"><div style="text-align: center;">${inner}</div></span></div></div>` });
  zone.prepend(sec);
  scrollTo({ top: 0, behavior: "smooth" });
  markDirty();
  return sec;
}
function newTextSection() {
  return sectionEl({
    id: "s" + Date.now(),
    kind: "html",
    html: '<div class="widget widget--zone-widget"><div class="bk-content-text content widget__content"><span class="content-block"><div style="text-align: center;">Ny tekst</div></span></div></div>',
  });
}

function secData(w, row) {
  const copy = w.querySelector(".mf-body").cloneNode(true);
  unlock(copy);
  const out = { ...(originals.get(w.dataset.id) || {}), id: w.dataset.id, kind: w.dataset.kind, html: clean(copy.innerHTML).trim() };
  delete out.row; delete out.w;
  if (row) { out.row = row; const wt = +w.dataset.w || 1; if (wt !== 1) out.w = wt; }
  return out;
}
function collect() {
  normalize();
  const out = [];
  for (const el of zone.children) {
    if (el.classList.contains("mf-sec")) out.push(secData(el, null));
    else if (el.classList.contains("mf-row")) for (const c of el.querySelectorAll(":scope > .mf-sec")) out.push(secData(c, el.dataset.row));
  }
  return out;
}

// --- Layout: rækker med 2–3 kolonner ---
const MAX_COLS = 3;
const newRowId = () => "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
function applyWidth(sec) {
  const inRow = sec.parentElement && sec.parentElement.classList.contains("mf-row");
  sec.style.flexGrow = inRow ? String(+sec.dataset.w || 1) : "";
  if (!inRow) delete sec.dataset.w;
}
function makeRow(id) { const r = document.createElement("div"); r.className = "mf-row"; r.dataset.row = id || newRowId(); return r; }
function buildZone(sections) {
  const els = [];
  for (let i = 0; i < sections.length; ) {
    const r = sections[i].row;
    let j = i + 1;
    if (r) while (j < sections.length && sections[j].row === r && j - i < MAX_COLS) j++;
    if (r && j - i >= 2) {
      const row = makeRow(r);
      for (let k = i; k < j; k++) row.append(sectionEl(sections[k]));
      els.push(row);
    } else els.push(sectionEl({ ...sections[i], w: undefined }));
    i = j;
  }
  zone.replaceChildren(...els);
  zone.querySelectorAll(".mf-sec").forEach(applyWidth);
}
function normalize() {
  zone.querySelectorAll(":scope > .mf-row").forEach((row) => {
    const kids = row.querySelectorAll(":scope > .mf-sec");
    if (kids.length === 0) row.remove();
    else if (kids.length === 1) row.replaceWith(kids[0]);
  });
  zone.querySelectorAll(".mf-sec").forEach(applyWidth);
}
const blockOf = (sec) => (sec.parentElement.classList.contains("mf-row") ? sec.parentElement : sec);

async function save() {
  if (!page || saving) return;
  if (!canEdit) return say("Du ejer ikke siden – ændringer er ikke gemt", "err");
  saving = true;
  const version = editVersion;
  document.getElementById("mf-save").disabled = true;
  say("Gemmer…");
  try {
  const { data: saved, error } = await db.from("pages").update({
    sections: collect(),
    title: document.getElementById("mf-title").value,
    legend: document.getElementById("mf-legend").value,
    published: document.getElementById("mf-pub").checked,
  }).eq("id", page.id).eq("owner_id", currentUserId).eq("updated_at", page.updated_at).select("id,updated_at").maybeSingle();
  if (error) return say("Fejl: " + error.message, "err");
  if (!saved) return say("Ikke gemt: Siden er ændret et andet sted, eller din adgang er ændret. Genindlæs siden.", "err");
  page.updated_at = saved.updated_at;
  dirty = editVersion !== version;
  say(dirty ? "Gemt – der er nyere ændringer, som ikke er gemt" : "Gemt " + new Date().toLocaleTimeString("da-DK", { hour: "2-digit", minute: "2-digit" }), dirty ? "" : "ok");
  } catch { say("Forbindelsen blev afbrudt. Ændringerne er ikke bekræftet gemt.", "err"); }
  finally { saving = false; document.getElementById("mf-save").disabled = !canEdit; }
}

// --- Start ---
const { data: { session } } = await db.auth.getSession();
if (!session) { location.href = "edit.html"; }
else if (!slug) { say("Ingen side valgt", "err"); }
else {
  currentUserId = session.user.id;
  const { data, error } = await db.from("pages").select("id,slug,title,legend,sections,published,owner_id,updated_at").eq("slug", slug).maybeSingle();
  if (error || !data) say("Siden findes ikke", "err");
  else {
    page = data;
    document.title = "Redigér: " + (page.title || page.slug);
    document.getElementById("mf-title").value = page.title || "";
    document.getElementById("mf-legend").value = page.legend || "";
    document.getElementById("mf-pub").checked = !!page.published;
    buildZone(page.sections);
    history = [JSON.stringify(collect())]; histPos = 0;
    zone.querySelectorAll("legend").forEach((l) => (l.textContent = page.legend));
    canEdit = page.owner_id === session.user.id;
    if (!canEdit) {
      zone.querySelectorAll('[contenteditable]').forEach(el => el.setAttribute('contenteditable','false'));
      document.querySelectorAll('.mf-bar button, #mf-top button:not(#mf-back):not(#mf-view), #mf-top input, #mf-top select, #mf-add-end').forEach(el => el.disabled = true);
      say("Du ejer ikke siden – vises uden mulighed for at redigere", "err");

const IMG_TYPES = ["image/jpeg", "image/png", "image/webp", "image/gif"];
const MAX_SIDE = 1600;
async function shrink(file) {
  // GIF bevares (animation); store billeder skaleres ned og gemmes som WebP/JPEG.
  if (file.type === "image/gif") return { blob: file, type: file.type, ext: "gif" };
  let bmp;
  try { bmp = await createImageBitmap(file); } catch { return { blob: file, type: file.type, ext: file.type.split("/")[1] }; }
  const scale = Math.min(1, MAX_SIDE / Math.max(bmp.width, bmp.height));
  if (scale === 1 && file.size < 1.5e6) return { blob: file, type: file.type, ext: file.type.split("/")[1].replace("jpeg", "jpg") };
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  const keepAlpha = file.type === "image/png" || file.type === "image/webp";
  for (const [type, ext] of [["image/webp", "webp"], [keepAlpha ? "image/png" : "image/jpeg", keepAlpha ? "png" : "jpg"]]) {
    const blob = await new Promise((r) => c.toBlob(r, type, 0.85));
    if (blob && blob.type === type) return { blob, type, ext };
  }
  return { blob: file, type: file.type, ext: file.type.split("/")[1] };
}

  if (!canEdit) return say("Du ejer ikke siden", "err");
  if (!IMG_TYPES.includes(file.type)) return say("Kun JPG, PNG, WebP eller GIF", "err");
  if (file.size > 20e6) return say("Billedet er for stort (over 20 MB)", "err");
  say("Uploader billede…");
  try {
    const { blob, type, ext } = await shrink(file);
    if (blob.size > 5242880) return say("Billedet er stadig over 5 MB efter komprimering", "err");
    const path = `${currentUserId}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
    const { error } = await db.storage.from("images").upload(path, blob, { contentType: type, cacheControl: "31536000", upsert: false });
    if (error) return say("Upload fejlede: " + error.message, "err");
    const url = db.storage.from("images").getPublicUrl(path).data.publicUrl;
    if (range) { savedRange = range; exec("insertImage", url); }
    else addTopSection(`<img src="${escAttr(url)}" alt="">`);
    const alt = file.name.replace(/\.[^.]+$/, "").replace(/[-_]+/g, " ").slice(0, 80);
    zone.querySelectorAll(`img[src="${CSS.escape(url)}"]`).forEach((im) => im.setAttribute("alt", alt));
    say(range ? "Billede indsat – husk at gemme" : "Billede lagt øverst – træk det derhen, hvor det skal stå, og husk at gemme");
  } catch (err) { say("Upload fejlede. Prøv igen.", "err"); }
}

  else if (info.mode === "into") Object.assign(ind.style, { left: box.left + "px", top: box.bottom - 3 + "px", width: box.width + "px", height: "4px" });
  else Object.assign(ind.style, { left: box.left + "px", top: (info.mode === "before" ? box.top - 4 : box.bottom + 1) + "px", width: box.width + "px", height: "3px" });
  ghost.textContent = !ok ? "Højst 3 kolonner i en række" : ({ before: "Slip: over", after: "Slip: under", into: "Slip: nederst i boksen", end: "Slip: ny boks nederst", "col-left": "Slip: ny kolonne til venstre", "col-right": "Slip: ny kolonne til højre" })[info.mode];
}
function wrapInSection(el) {
  const sec = sectionEl({ id: "s" + Date.now() + Math.random().toString(36).slice(2, 5), kind: "html",
    html: '<div class="widget widget--zone-widget"><div class="bk-content-text content widget__content"><span class="content-block"><i data-mf-slot></i></span></div></div>' });
  sec.querySelector("[data-mf-slot]").replaceWith(el);
  return sec;
}
function eDoDrop(info) {
  const el = eDrag.el, srcBody = eDrag.src;
  if (info.mode === "before") info.target.before(el);
  else if (info.mode === "after") info.target.after(el);
  else if (info.mode === "into") (info.target.querySelector(".content-block") || info.target).append(el);
  else if (info.mode === "end") zone.append(wrapInSection(el));
  else {
    const t = info.target, sec = wrapInSection(el);
    let row = t.parentElement.classList.contains("mf-row") ? t.parentElement : null;
    if (!row) { row = makeRow(); t.replaceWith(row); row.append(t); }
    if (info.mode === "col-left") t.before(sec); else t.after(sec);
  }
  // Tom kilde-boks fjernes
  if (srcBody && !hasContent(srcBody)) srcBody.closest(".mf-sec").remove();
  normalize();
  markDirty();
}
function eEnd(apply) {
  if (!eDrag) return;
  clearInterval(scrollTimer);
  if (apply && eDrag.started && eDrag.info && eDrag.info.mode !== "self" && eDrag.info.ok !== false) eDoDrop(eDrag.info);
  eDrag.el.classList.remove("mf-el-dragging");
  if (!eDrag.el.getAttribute("class")) eDrag.el.removeAttribute("class");
  document.body.classList.remove("mf-is-dragging");
  ind.style.display = ghost.style.display = "none";
  eDrag = null;
  placeEgrip(null);
}
function eStart(el, e) {
  eDrag = { el, src: el.closest(".mf-body"), info: null, started: false, sx: e.clientX, sy: e.clientY };
}
egrip.addEventListener("pointerdown", (e) => {
  if (!egripFor || !canEdit || e.button > 0) return;
  e.preventDefault();
  egrip.setPointerCapture(e.pointerId);
  eStart(egripFor, e);
});
zone.addEventListener("pointerdown", (e) => {
  // Billeder og video kan tages direkte (mus/pen)
  if (e.pointerType === "touch" || e.button > 0 || !canEdit || e.target.closest(".mf-grip, .mf-bar")) return;
  const m = e.target.closest("img, .mf-video, video, iframe, .mf-lockbox");
  if (!m) return;
  const el = movableOf(m);
  if (!el) return;
  e.preventDefault();
  eStart(el, e);
}, true);
document.addEventListener("pointermove", (e) => {
  if (!eDrag) return;
  if (!eDrag.started) {
    if (Math.hypot(e.clientX - eDrag.sx, e.clientY - eDrag.sy) < 6) return;
    eDrag.started = true;
    eDrag.el.classList.add("mf-el-dragging");
    document.body.classList.add("mf-is-dragging");
    ghost.style.display = "block";
    egrip.style.display = "none";
  }
  Object.assign(ghost.style, { left: e.clientX + 14 + "px", top: e.clientY + 14 + "px" });
  eShow(eDrag.info = eDropInfo(e.clientX, e.clientY));
  clearInterval(scrollTimer);
  const edge = 70, topH = document.getElementById("mf-top").offsetHeight, y = e.clientY, x = e.clientX;
  const dy = y < topH + edge ? -14 : y > innerHeight - edge ? 14 : 0;
  if (dy) scrollTimer = setInterval(() => { scrollBy(0, dy); if (eDrag) eShow(eDrag.info = eDropInfo(x, y)); }, 16);
});
document.addEventListener("pointerup", () => eEnd(true));
document.addEventListener("pointercancel", () => eEnd(false));
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && eDrag) eEnd(false); });

zone.addEventListener("beforeinput", (e) => {
  if (e.inputType === "historyUndo") { e.preventDefault(); histStep(-1); }
  else if (e.inputType === "historyRedo") { e.preventDefault(); histStep(1); }
});
zone.addEventListener("input", markDirty);
// Formularen vises som reference og må aldrig sende eller navigere under redigering.
zone.addEventListener("submit", event => event.preventDefault(), true);

// Indsat tekst renses, så der ikke følger skjult formatering eller scripts med.
zone.addEventListener("paste", (e) => {
  const img = [...e.clipboardData.files].find((x) => IMG_TYPES.includes(x.type));
  if (img) { e.preventDefault(); return uploadImage(img, savedRange && savedRange.cloneRange()); }
  const vid = [...e.clipboardData.files].find((x) => VID_TYPES.includes(x.type));
  if (vid) { e.preventDefault(); return uploadVideo(vid, savedRange && savedRange.cloneRange()); }
  const html = e.clipboardData.getData("text/html");
  const text = e.clipboardData.getData("text/plain");
  e.preventDefault();
  if (html) document.execCommand("insertHTML", false, DOMPurify.sanitize(html, { FORBID_TAGS: ["style", "script", "form", "iframe"], FORBID_ATTR: ["class", "id"] }));
  else document.execCommand("insertText", false, text);
});

document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); save(); }
  if ((e.ctrlKey || e.metaKey) && !e.altKey && canEdit && !e.target.closest("#mf-meta")) {
    const k = e.key.toLowerCase();
    if (k === "z" && !e.shiftKey) { e.preventDefault(); histStep(-1); }
    else if (k === "y" || (k === "z" && e.shiftKey)) { e.preventDefault(); histStep(1); }
  }
});
window.addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
</script>
</body>
